<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HCPP20334 DEV</title>
<style>
:root{--bg:#000;--fg:#ededed;--dim:#6b6b6b;--line:#222;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{background:#000;color:var(--fg);font-family:"JetBrains Mono","IBM Plex Mono",ui-monospace,Consolas,monospace;min-height:100%}
body{overflow-x:hidden}
a{color:inherit;text-decoration:none}
header,footer{display:flex;justify-content:space-between;align-items:center;padding:28px 5vw;font-size:12px;letter-spacing:.12em}
.logo{display:flex;gap:22px;font-size:13px}
nav{display:flex;gap:28px}
nav button{background:none;border:0;color:var(--dim);font:inherit;cursor:pointer;letter-spacing:.08em}
nav button span{margin-right:8px;opacity:.5}
nav button.on,nav button:hover{color:#fff}
main{min-height:calc(100vh - 130px);display:grid;position:relative}
section{display:none;grid-template-columns:1fr 1fr;gap:4vw;padding:0 5vw;align-items:center;animation:in .5s}
section.on{display:grid}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.art{position:relative;height:70vh;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;width:min(360px,70vw);aspect-ratio:1;animation:spin 40s linear infinite}
.ring text{font-size:15px;letter-spacing:.35em;fill:#ddd}
@keyframes spin{to{transform:rotate(360deg)}}
.logo3d{width:min(340px,68vw);aspect-ratio:314/130;perspective:900px;filter:grayscale(1) contrast(1.15) drop-shadow(0 0 18px rgba(255,255,255,.18))}
.stack{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:rot 9s linear infinite}
.stack img{position:absolute;inset:0;width:100%;height:100%;display:block}
@keyframes rot{from{transform:rotateX(-14deg) rotateY(0)}to{transform:rotateX(-14deg) rotateY(360deg)}}
.tag{font-size:11px;letter-spacing:.2em;color:var(--dim);margin-bottom:34px}
.tag i{display:inline-block;width:7px;height:7px;background:#ddd;margin-right:10px}
h1{font-family:Helvetica,Arial,sans-serif;font-weight:800;font-size:clamp(52px,8vw,112px);letter-spacing:-.07em;line-height:1}
h1 em{color:#777;font-style:normal}
.bio{margin:48px 0;color:#aaa;line-height:2;font-size:14px;max-width:520px}
.big{display:flex;gap:24px;flex-wrap:wrap;font-size:17px}
.big a{display:flex;justify-content:space-between;gap:110px;padding:14px 0;border-bottom:1px solid var(--line);transition:.2s}
.big a:hover{padding-left:10px;color:#fff;border-color:#666}
.small{margin-top:26px;display:flex;gap:20px;font-size:11px;color:#aaa}
.small b{font-weight:400;color:var(--dim)}
.next{margin-top:70px;background:none;border:0;color:var(--dim);font:inherit;font-size:11px;letter-spacing:.15em;cursor:pointer}
.next:hover{color:#fff}
/* projects */
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.list button{display:flex;gap:18px;align-items:baseline;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--dim);font:inherit;font-size:clamp(15px,2vw,22px);padding:16px 0;cursor:pointer;transition:.2s}
.list button small{font-size:11px;opacity:.5}
.list button:hover,.list button.on{color:#fff;padding-left:14px}
.list button.on::after{content:"●";margin-left:auto;font-size:9px}
.detail{min-height:300px}
.detail h2{font-family:Helvetica,Arial,sans-serif;font-size:clamp(34px,4.6vw,64px);letter-spacing:-.05em;line-height:1.05;margin:10px 0 28px;word-break:break-word}
.detail p{color:#aaa;line-height:1.9;font-size:14px;max-width:520px}
.lang{display:inline-block;margin-top:26px;border:1px solid #444;padding:6px 12px;font-size:12px;letter-spacing:.1em}
.ctrl{display:flex;gap:12px;margin-top:40px}
.ctrl button{background:none;border:1px solid #333;color:#ddd;font:inherit;width:44px;height:44px;cursor:pointer}
.ctrl button:hover{background:#fff;color:#000}
footer{color:var(--dim);font-size:11px}
@media(max-width:820px){section{grid-template-columns:1fr;padding-top:10px}.art{height:46vh}nav{gap:14px}.big a{gap:40px}header{padding:20px 5vw}}
.c{position:relative}
.c.off{opacity:0}
h1{position:relative}
h1.glitching{animation:gl .09s steps(2) infinite}
h1.glitching::before,h1.glitching::after{content:attr(data-t);position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap}
h1.glitching::before{color:#fff;clip-path:var(--c1,inset(0 0 100% 0));transform:translateX(var(--x1,0))}
h1.glitching::after{color:#777;clip-path:var(--c2,inset(0 0 100% 0));transform:translateX(var(--x2,0))}
@keyframes gl{0%{transform:translateX(0)}50%{transform:translateX(-4px) skewX(-6deg)}100%{transform:translateX(4px) skewX(4deg)}}
</style>
</head>

for(let i=0;i<16;i++){const im=new Image();im.src=IMG;im.alt="";im.style.transform=`translateZ(${(i-7.5)*2.2}px)`;if(i>0&&i<15)im.style.filter="brightness(.55)";st.appendChild(im)}
const list=document.getElementById("list"),det=document.getElementById("detail");
let cur=0,page=0;
P.forEach((p,i)=>{const b=document.createElement("button");b.innerHTML=`<small>${String(i+1).padStart(2,"0")}</small>${p.n}`;b.onclick=()=>pick(i);list.appendChild(b)});
function pick(i){
  cur=(i+P.length)%P.length;
  [...list.children].forEach((b,k)=>b.classList.toggle("on",k===cur));
  const p=P[cur];
  det.innerHTML=`<div class="tag">${String(cur+1).padStart(2,"0")} / ${String(P.length).padStart(2,"0")}</div><h2>${p.n}</h2><p>${p.d}</p>${p.l?`<span class="lang">${p.l}</span>`:""}<div class="ctrl"><button id="pv">←</button><button id="nx">→</button></div>`;
  document.getElementById("pv").onclick=()=>pick(cur-1);
  document.getElementById("nx").onclick=()=>pick(cur+1);
}
function go(n){
  page=n;
  document.querySelectorAll("section").forEach((s,k)=>s.classList.toggle("on",k===n));
  document.querySelectorAll("nav button").forEach((b,k)=>b.classList.toggle("on",k===n));
  document.getElementById("pg").textContent=`0${n} / 01`;
}
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));

    if(e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();pick(cur+1)}
    if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();pick(cur-1)}
  }
});
(function(){
if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
const cv=document.createElement("canvas");cv.style.cssText="position:fixed;left:0;top:0;pointer-events:none;z-index:50";document.body.appendChild(cv);
const cx=cv.getContext("2d"),D=Math.min(devicePixelRatio||1,2);let W,H,run=false,active=0;const dots=[];
function rs(){W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cv.style.width=W+"px";cv.style.height=H+"px";cx.setTransform(D,0,0,D,0,0)}
rs();addEventListener("resize",rs);
function loop(){cx.clearRect(0,0,W,H);
 for(let i=dots.length-1;i>=0;i--){const d=dots[i];d.t++;d.x+=d.vx;d.y+=d.vy;d.vx*=.97;d.vy*=.97;const a=1-d.t/d.l;if(a<=0){dots.splice(i,1);continue}cx.globalAlpha=a;cx.fillStyle=d.c;cx.fillRect(d.x,d.y,d.s,d.s)}
 if(dots.length||active)requestAnimationFrame(loop);else run=false}
function burst(c){const r=c.getBoundingClientRect(),k=Math.max(r.height/18,.8);
 for(let i=0;i<9;i++)dots.push({x:r.left+Math.random()*r.width,y:r.top+Math.random()*r.height,vx:(Math.random()-.35)*3.2*k,vy:(Math.random()-.5)*3.2*k,t:0,l:25+Math.random()*45,s:(Math.random()*1.6+.8)*Math.min(k,1.6),c:Math.random()<.3?"#777":"#fff"})}
function prep(el){if(el.dataset.p)return;el.dataset.p=1;
 const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);
 ns.forEach(n=>{const f=document.createDocumentFragment();for(const ch of n.textContent){if(!ch.trim())f.append(ch);else{const s=document.createElement("span");s.className="c";s.textContent=ch;f.append(s)}}n.replaceWith(f)})}
function glitch(el){el.dataset.t=el.textContent;prep(el);const cs=[...el.querySelectorAll(".c")];if(!cs.length)return;
 const SY="01#$%@&<>/\\|[]{}=+*";
 el.classList.add("glitching");let f=0;const N=16;

 const band=()=>{const t=Math.random()*85,h=4+Math.random()*22;return "inset("+t+"% 0 "+Math.max(0,100-t-h)+"% 0)"};
 (function step(){f++;
  {el.style.setProperty("--c1",band());el.style.setProperty("--x1",(Math.random()*70-35)+"px");el.style.setProperty("--c2",band());el.style.setProperty("--x2",(Math.random()*70-35)+"px")}
  cs.forEach(c=>{
   if(!c.dataset.o)c.dataset.o=c.textContent;
   if(Math.random()<.25){c.style.left=(Math.random()*12-6)+"px";c.style.top=(Math.random()*6-3)+"px"}else{c.style.left=c.style.top="0"}
   if(f<N-3&&Math.random()<.2){c.textContent=SY[Math.floor(Math.random()*SY.length)]}else c.textContent=c.dataset.o;
   });
  if(f<N)setTimeout(step,95);
  else{cs.forEach(c=>{c.textContent=c.dataset.o;c.classList.remove("off");c.style.left=c.style.top="0"});el.classList.remove("glitching");["--c1","--c2","--x1","--x2"].forEach(v=>el.style.removeProperty(v))}})()}
const SEL="h1";
function tick(){
 const v=[...document.querySelectorAll(SEL)].filter(e=>e.offsetParent);
 if(v.length)glitch(v[Math.floor(Math.random()*v.length)]);
 setTimeout(tick,3000+Math.random()*3000)}
setTimeout(tick,1800);
})();
pick(0);
</script>
